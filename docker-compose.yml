services:
  base:
    build:
      context: .
      dockerfile: Dockerfile_tp2
      args:
        USERNAME: # Transmis par la variable d'environnement USERNAME
        USERID:   # Transmis par la variable d'environnement USERID
    container_name: fw1-tp2-${USERNAME}
    command: /bin/bash
    tty: true
    stdin_open: true
    volumes:
    - ".:/home/user/workspace"
    ports:
    - "8080:8000"
    environment:
      PS1: "[ $$(whoami) | \\w ] "
