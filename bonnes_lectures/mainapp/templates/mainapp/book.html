<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ book.title }}</title>
</head>
<body>
  <h1>{{ book.title }}</h1>

  <p><strong>Auteur :</strong> {{ book.author }}</p>
  <p><strong>Maison d'édition :</strong> {{ book.publisher }}</p>
  <p><strong>Année :</strong> {{ book.year }}</p>
  <p><strong>ISBN :</strong> {{ book.isbn }}</p>

  <h2>Présentation</h2>
  <p>{{ book.backCover }}</p>

  <p>
    <a href="{% url 'edit_book' book.id %}">Modifier ce livre</a>
    <a href="{% url 'delete_book' book.id %}">Supprimer ce livre</a>
  </p>
  <p> <a href="{% url 'book_list' %}">Retour à la liste des livres</a></p>
</body>
</html>
