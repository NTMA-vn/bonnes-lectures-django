<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ book.title }}</title>
</head>
<body>
  <h1>{{ book.title }}</h1>

  <p><strong>Auteur :</strong> {{ book.auteur }}</p>
  <p><strong>Maison d'édition :</strong> {{ book.publisher }}</p>
  <p><strong>Année :</strong> {{ book.year }}</p>
  <p><strong>ISBN :</strong> {{ book.isbn }}</p>

  <h2>Présentation</h2>
  <p>{{ book.backCover }}</p>

  <p><a href="/book">Retour à la liste des livres</a></p>
</body>
</html>
