<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ajouter un livre</title>
</head>
<body>
  <h1>Ajouter un livre</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer</button>
  </form>

  <p><a href="{% url 'book_list' %}">Retour à la liste des livres</a></p>
</body>
</html>
