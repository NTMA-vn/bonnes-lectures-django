<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Liste des livres</title>
</head>
<body>
  <h1>Liste des livres</h1>
  <ul>
    {% for book in books %}
      <li>{{ book.title }} - {{ book.author }} ({{ book.year }})</li>
    {% empty %}
      <li>Aucun livre enregistré.</li>
    {% endfor %}
  </ul>
  <p><a href="/">Retour à l'accueil</a></p>
</body>
</html>
