<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Liste des livres</title>
</head>
<body>
  <h1>Liste des livres</h1>

  <ul>
    {% for book in books %}
      <li>
        <a href="{% url 'book' book.id %}">{{ book.title }}</a> - {{ book.author }}
        (<a href="{% url 'edit_book' book.id %}">modifier</a>,
         <a href="{% url 'delete_book' book.id %}">supprimer</a>)
      </li>
    {% empty %}
      <li>Aucun livre pour le moment.</li>
    {% endfor %}
  </ul>
  <p><a href="{% url 'new_book' %}">Nouveau livre</a></p>
  <p><a href="{% url 'welcome' %}">Retour à l'accueil</a></p>
</body>
</html>
