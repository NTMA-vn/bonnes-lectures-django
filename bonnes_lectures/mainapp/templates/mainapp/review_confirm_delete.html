{% extends 'mainapp/base.html' %}
{% block content %}
  <h1>Voulez-vous supprimer cet avis ?</h1>
  <p>{{ review.body }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
  </form>
  <p><a href="{% url 'book' book.id %}">Annuler</a></p>
{% endblock %}
