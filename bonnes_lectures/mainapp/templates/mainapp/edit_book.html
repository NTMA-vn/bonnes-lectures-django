<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Modifier {{ book.title }}</title>
</head>
<body>
  <h1>Modifier le livre</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer les modifications</button>
  </form>

  <p><a href="{% url 'book' book.id %}">Annuler et retourner à la fiche</a></p>
</body>
</html>
